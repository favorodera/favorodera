  '@nuxtjs/seo': ^5.3.16
  '@tailwindcss/vite': ^4.3.3
  '@takumi-rs/core': ^2.17.1
  '@vercel/analytics': ^2.0.1
  '@vueuse/core': ^15.0.0
  '@vueuse/nuxt': ^15.0.0
  'eslint': ^10.13.0
  'motion-v': ^2.8.0
  'nuxt': ^4.6.2
  'nuxt-schema-org': ^6.4.3
  'nuxtseo-layer-devtools': ^5.3.16
  'reka-ui': ^2.11.0
  'tailwindcss': ^4.3.3
