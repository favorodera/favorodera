  '@nuxt/eslint': ^1.17.0
  '@nuxt/fonts': ^1.2.0
  '@nuxt/image': ^2.2.1
  '@nuxtjs/color-mode': ^4.1.0
  '@nuxtjs/seo': ^6.0.1
  '@tailwindcss/vite': ^4.3.5
  '@takumi-rs/core': ^2.20.0
  '@types/node': ^26.6.6
  '@vercel/analytics': ^2.0.1
  'eslint': ^10.15.0
  'nuxt': ^4.6.4
  'nuxt-schema-org': ^7.0.1
  nuxtseo-devtools-host: ^1.0.3
  'nuxtseo-layer-devtools': ^5.3.16
  'reka-ui': ^2.11.0
  tailwind-variants: ^4.0.2
  'tailwindcss': ^4.3.5
  'typescript': ^6.0.3
  'vue': ^3.5.45
  'vue-tsc': ^3.3.14

